name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  browser-parity:
    name: browser-parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit msedge
      - run: npm run build:web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pages-build:
    name: pages-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: test "$(cat dist/web/CNAME)" = "particlelens.liuzhaohan.com"
      - uses: actions/upload-artifact@v7
        with:
          name: pages-build
          path: dist/web/
          retention-days: 7

  windows-package:
    name: windows-package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - shell: pwsh
        run: ./scripts/build_windows_release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: release/
          retention-days: 14

  safari-smoke:
    name: safari-smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --locked
      - run: npm run build:web
      - run: sudo safaridriver --enable
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/particlelens-vite.log 2>&1 &
          echo $! > /tmp/particlelens-vite.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4174/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/particlelens-vite.log
          exit 1
      - run: uv run --with selenium python scripts/safari_smoke.py
      - name: Stop preview server
        if: always()
        run: |
          if test -f /tmp/particlelens-vite.pid; then
            kill "$(cat /tmp/particlelens-vite.pid)" || true
          fi
