[project]
name = "particlelens"
version = "0.2.1"
description = "Analyze microscope images and export particle size distributions."
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "computer-vision",
    "droplet-analysis",
    "image-analysis",
    "microscopy",
    "opencv",
    "particle-size-distribution",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy==2.2.5",
    "opencv-python==4.11.0.86",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://particlelens.liuzhaohan.com"
Repository = "https://github.com/martin-lzh/ParticleLens"
Issues = "https://github.com/martin-lzh/ParticleLens/issues"
Releases = "https://github.com/martin-lzh/ParticleLens/releases"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "RUF046"]
